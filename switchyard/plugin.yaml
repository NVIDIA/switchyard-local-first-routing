name: nvidia-switchyard
label: "NVIDIA Switchyard (Beta)"
version: 0.1.1
description: "Beta. Automatic inference routing between local and cloud models, escalating tasks only when needed. Any URL or third-party provider set up in Hermes can serve either model, under that provider's terms and conditions. Runs Switchyard in a loopback sidecar."
author: NVIDIA
license: Apache-2.0
python_dependencies:
  - nemo-switchyard==0.4.0
provides_hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - transform_llm_output
  - transform_api_error_classification
provides_middleware:
  - llm_request
